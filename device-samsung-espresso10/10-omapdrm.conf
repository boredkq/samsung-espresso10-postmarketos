# Fix artifacts on OMAP4430 (samsung-espresso10) by forcing 24-bit depth and disabling ShadowFB
Section "Device"
    Identifier "OMAPDRM"
    Driver "modesetting"
    Option "DefaultDepth" "24"
    Option "ShadowFB" "false"
    Option "AccelMethod" "none"
    Option "SWcursor" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "OMAPDRM"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
