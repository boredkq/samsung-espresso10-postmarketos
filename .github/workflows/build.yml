name: Build postmarketOS TWRP ZIP

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Target installation partition (data = 12.1 GB DATAFS, external_sd = MicroSD card)'
        required: true
        default: 'data'
      ui:
        description: 'Desktop Environment (lxqt, mate, xfce4, weston)'
        required: true
        default: 'weston'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel & TWRP Flashable ZIP
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            git \
            openssl \
            sudo \
            bash \
            xz-utils \
            util-linux \
            qemu-user-static \
            binfmt-support

      - name: Install pmbootstrap
        run: |
          sudo apt-get install -y multipath-tools
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -sf /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Cache pmbootstrap packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/var/pmbootstrap/cache_pkgs
            ~/.local/var/pmbootstrap/packages
            ~/.local/var/pmbootstrap/cache_git
            ~/.local/var/pmbootstrap/config_abuild
            ~/.config/abuild
          key: pmbootstrap-cache-${{ runner.os }}-${{ hashFiles('linux-openpvrsgx/**') }}
          restore-keys: |
            pmbootstrap-cache-${{ runner.os }}-

      - name: Fix permissions on cached pmbootstrap directory
        run: |
          mkdir -p ~/.local/var/pmbootstrap
          sudo chown -R $(id -u):$(id -g) ~/.local/var/pmbootstrap || true
          sudo chmod -R 777 ~/.local/var/pmbootstrap || true

      - name: Build TWRP Recovery ZIP
        env:
          PMOS_USER: user
          PMOS_PASSWORD: "147147"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chmod +x scripts/build_twrp_zip.sh
          ./scripts/build_twrp_zip.sh "${{ github.event.inputs.partition || 'data' }}" "${{ github.event.inputs.ui || 'lxqt' }}"

      - name: Prepare pmbootstrap cache for saving
        if: always()
        run: |
          # Fix ownership and permissions on root-created files (like config_abuild/*.rsa)
          # so actions/cache post-job tar does not fail with "Permission denied"
          sudo chmod -R 777 ~/.local/var/pmbootstrap ~/.config/abuild 2>/dev/null || true
          # Remove socket files and locks that break tar
          find ~/.local/var/pmbootstrap -type s -delete 2>/dev/null || true
          find ~/.local/var/pmbootstrap -name "*.lock" -delete 2>/dev/null || true

      - name: Upload pmbootstrap failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-failure-log
          path: ~/.local/var/pmbootstrap/log.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload TWRP ZIP Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pmos-samsung-espresso10-twrp-zip
          path: |
            output/*.zip
            output/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "postmarketOS & Ubuntu Touch TWRP Builds"
          body: "Flashable TWRP recovery ZIP images for Samsung Galaxy Tab 2 10.1 (espresso10 / p5100 / p5110)."
          files: |
            output/*.zip
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
